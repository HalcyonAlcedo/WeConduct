name: Deploy Docs

on:
  push:
    branches:
      - docs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run baseline tests
        run: python -m pytest -q

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Run page validator when available
        shell: pwsh
        run: |
          if (Test-Path "validate_pages.py") {
            python validate_pages.py
          } else {
            Write-Host "Pending validate_pages.py: file not found"
          }

      - name: Run graph validator when available
        shell: pwsh
        run: |
          if (Test-Path "validate_graph_examples.py") {
            python validate_graph_examples.py
          } else {
            Write-Host "Pending validate_graph_examples.py: file not found"
          }

      - name: Build site
        run: python -m mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
