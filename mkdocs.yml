site_name: WeConduct 文档
site_description: WeConduct 0.8.1 与 Weave 0.5.0 文档站点，当前处于建设阶段
site_author: HalcyonAlcedo
copyright: "&copy; WeConduct 用户文档"
site_url: https://halcyonalcedo.github.io/WeConduct/
repo_url: https://github.com/HalcyonAlcedo/WeConduct
repo_name: HalcyonAlcedo/WeConduct
edit_uri: ""

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: zh

extra_javascript:
  - assets/javascripts/weconduct-graph.js

extra_css:
  - assets/stylesheets/weconduct-graph.css

nav:
  - 首页: index.md
  - WeConduct:
      - 总览: weconduct/index.md
      - 快速开始:
          - 安装 0.8.1: weconduct/getting-started/install.md
          - 创建第一个项目: weconduct/getting-started/first-project.md
          - 第一次运行: weconduct/getting-started/first-run.md
          - 保存和打开: weconduct/getting-started/save-and-open.md
      - 核心概念:
          - 项目与工作区: weconduct/concepts/projects-and-workspaces.md
          - 节点、端口与边: weconduct/concepts/nodes-ports-and-edges.md
          - 控制流与数据流: weconduct/concepts/control-and-data-flow.md
          - 变量、类型与表达式: weconduct/concepts/variables-types-and-expressions.md
          - 子图与自定义组件: weconduct/concepts/subgraphs-and-components.md
          - 资源与安全: weconduct/concepts/resources-and-security.md
      - 使用指南:
