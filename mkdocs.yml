site_name: WeConduct 文档
site_description: WeConduct 0.8.1 与 Weave 0.5.0 文档站点，当前处于建设阶段
site_author: HalcyonAlcedo
copyright: "&copy; WeConduct 用户文档"
site_url: https://halcyonalcedo.github.io/WeConduct/
repo_url: https://github.com/HalcyonAlcedo/WeConduct
repo_name: HalcyonAlcedo/WeConduct
edit_uri: ""

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: zh

extra_javascript:
  - assets/javascripts/weconduct-graph.js

extra_css:
  - assets/stylesheets/weconduct-graph.css

nav:
  - 首页: index.md
